name: Desktop Fly CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            out: desktopfly_amd64
            zip: desktopfly_amd64.zip

          - name: macos-arm64
            runs_on: macos-latest
            GOOS: darwin
            GOARCH: arm64
            out: desktopfly_macos_arm64
            zip: desktopfly_macos_arm64.zip

          - name: windows-amd64
            runs_on: windows-latest
            GOOS: windows
            GOARCH: amd64
            out: desktopfly_win64.exe
            zip: desktopfly_win64.zip

    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.0'

    - name: Fetch latest `data` artifact from `data.yml` (Bash)
      if: runner.os != 'Windows'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/data.yml/runs --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n1)
        if [ -z "$RUN_ID" ]; then
          echo "No successful data workflow run found" >&2
          exit 1
        fi
        DOWNLOAD_URL=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name=="data") | .archive_download_url' | tr -d '"')
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "No data artifact found in run $RUN_ID" >&2
          exit 1
        fi
        curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o data.zip "$DOWNLOAD_URL"
      shell: bash

    - name: Fetch latest `data` artifact from `data.yml` (PowerShell)
      if: runner.os == 'Windows'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $token = "${{ env.GH_TOKEN }}"
        $runsJson = gh api "repos/${{ github.repository }}/actions/workflows/data.yml/runs"
        $runs = $runsJson | ConvertFrom-Json
        $run = $runs.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1
        if (-not $run) {
          Write-Error 'No successful data workflow run found'
          exit 1
        }
        $run_id = $run.id
        $artifactsJson = gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts"
        $artifacts = $artifactsJson | ConvertFrom-Json
        $artifact = $artifacts.artifacts | Where-Object { $_.name -eq 'data' } | Select-Object -First 1
        if (-not $artifact) {
          Write-Error "No data artifact found in run $run_id"
          exit 1
        }
        $download_url = $artifact.archive_download_url
        Invoke-WebRequest -Uri $download_url -Headers @{ Authorization = "token $token" } -OutFile data.zip
      shell: powershell

    - name: Unpack data (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p data
        unzip data.zip -d data

    - name: Unpack data (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path 'data'
        Expand-Archive -LiteralPath data.zip -DestinationPath 'data'
        dir 'data'

    - name: Install system deps (robust)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common apt-transport-https ca-certificates
        sudo add-apt-repository -y universe || true
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config \
          libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxfixes-dev libxxf86vm-dev \
          libgl1-mesa-dev libglu1-mesa-dev

    - name: Tidy Go Modules
      run: go mod tidy

    - name: Build and Test (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "Building ${{ matrix.name }}"
        export CGO_ENABLED=1
        export GOOS=${{ matrix.GOOS }}
        export GOARCH=${{ matrix.GOARCH }}
        OUT=${{ matrix.out }}
        go build -o "$OUT"
        echo "Running tests"
        go test

    - name: Build and Test (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        echo "Building ${{ matrix.name }}"
        $env:CGO_ENABLED = '1'
        $env:GOOS = '${{ matrix.GOOS }}'
        $env:GOARCH = '${{ matrix.GOARCH }}'
        $env:OUT = '${{ matrix.out }}'
        go build -o $env:OUT
        echo "Running tests"
        go test

    - name: Zip artifact (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        zip -r "${{ matrix.zip }}" "${{ matrix.out }}" data

    - name: Zip artifact (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: Compress-Archive -Path "${{ matrix.out }}", "data" -DestinationPath "${{ matrix.zip }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.zip }}
        path: ${{ matrix.zip }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist

    - name: Flatten downloaded artifacts
      if: runner.os != 'Windows'
      run: |
        set -euo pipefail
        # Move zip files to temporary names to avoid collisions with artifact directories
        for f in dist/*/*.zip; do
          if [ -f "$f" ]; then
            base=$(basename "$f")
            tmp="$base.tmp.$$"
            mv "$f" "dist/$tmp"
          fi
        done

        # remove now-empty artifact directories
        for d in dist/*/; do
          [ -d "$d" ] && rm -rf "$d"
        done

        # Rename temp files to final names
        for t in dist/*.tmp.*; do
          [ -f "$t" ] || continue
          name=$(basename "$t")
          final=${name%%.tmp.*}
          mv "$t" "dist/$final"
        done
      shell: bash

    - name: List downloaded artifacts
      run: ls -lah dist

    - name: Create tag
      id: create_tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG=v${{ vars.VERSION }}
        gh api --method POST /repos/${{ github.repository }}/git/refs -f ref=refs/tags/$TAG -f sha=$(git rev-parse HEAD)
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Promote patch in VERSION
      env:
        GH_TOKEN: ${{ secrets.VARIABLES_PAT }}
      run: |
        set -euo pipefail
        IFS='.' read -r MAJOR MINOR PATCH <<< "${{ vars.VERSION }}"
        PATCH=$((PATCH + 1))
        echo "New version: $MAJOR.$MINOR.$PATCH"
        gh variable set VERSION --body "$MAJOR.$MINOR.$PATCH" --repo ${{ github.repository }}

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip
        tag_name: ${{ steps.create_tag.outputs.tag }}
