name: Desktop Fly CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
            out: desktopfly_amd64
            zip: desktopfly_amd64.zip

          - name: linux-arm64
            runs_on: ubuntu-latest
            GOOS: linux
            GOARCH: arm64
            out: desktopfly_linux_arm64
            zip: desktopfly_linux_arm64.zip

          - name: macos-arm64
            runs_on: macos-latest
            GOOS: darwin
            GOARCH: arm64
            out: desktopfly_macos_arm64
            zip: desktopfly_macos_arm64.zip

          - name: windows-amd64
            runs_on: windows-latest
            GOOS: windows
            GOARCH: amd64
            out: desktopfly_win64.exe
            zip: desktopfly_win64.zip

    runs-on: ${{ matrix.runs_on }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.0'

    - name: Fetch latest `data` artifact from `data.yml`
      run: |
        set -euo pipefail
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
        RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/data.yml/runs --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n1)
        if [ -z "$RUN_ID" ]; then
          echo "No successful data workflow run found" >&2
          exit 1
        fi
        ART_ID=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name=="data") | .id')
        if [ -z "$ART_ID" ]; then
          echo "No data artifact found in run $RUN_ID" >&2
          exit 1
        fi
        gh api repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip --method GET --silent > data.zip

    - name: Unpack data (Linux/macOS)
      if: runner.os != 'Windows'
      run: unzip data.zip -d .

    - name: Unpack data (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: Expand-Archive -LiteralPath data.zip -DestinationPath .

    - name: Tidy Go Modules
      run: go mod tidy

    - name: Build and Test
      run: |
        echo "Building ${{ matrix.name }}"
        export CGO_ENABLED=1
        export GOOS=${{ matrix.GOOS }}
        export GOARCH=${{ matrix.GOARCH }}
        OUT=${{ matrix.out }}
        go build -o "$OUT" main.go
        echo "Running tests"
        go test ./...

    - name: Zip artifact
      run: |
        zip -r "${{ matrix.zip }}" "${{ matrix.out }}" data

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.zip }}
        path: ${{ matrix.zip }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Create tag
      id: create_tag
      run: |
        set -euo pipefail
        TAG=v${{ vars.VERSION }}
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
        gh api --method POST /repos/${{ github.repository }}/git/refs -f ref=refs/tags/$TAG -f sha=$(git rev-parse HEAD)
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Promote patch in VERSION
      run: |
        set -euo pipefail
        IFS='.' read -r MAJOR MINOR PATCH <<< "${{ vars.VERSION }}"
        PATCH=$((PATCH + 1))
        echo "New version: $MAJOR.$MINOR.$PATCH"
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
        gh api --method PATCH /repos/${{ github.repository }}/actions/variables/VERSION -f value="$MAJOR.$MINOR.$PATCH"

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip
        tag_name: ${{ steps.create_tag.outputs.tag }}
